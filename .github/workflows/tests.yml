name: Tests

on:
  pull_request:
    paths:
      - "config/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "composer.json"
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "composer.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.job-name }}
    runs-on: "ubuntu-latest"
    # shortcut: Valinor excludes PHP 8.6, require this job when Valinor supports it.
    continue-on-error: ${{ matrix.php-version == '8.6' }}
    env:
      SYMFONY_REQUIRE: ${{matrix.symfony-require}}
      SYMFONY_DEPRECATIONS_HELPER: weak

    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4 LTS on minimum supported PHP
          - php-version: "8.3"
            symfony-require: "6.4.*"
            job-name: "PHP 8.3 - Symfony 6.4 LTS"

          # Symfony 7.4 LTS on minimum supported PHP
          - php-version: "8.3"
            symfony-require: "7.4.*"
            job-name: "PHP 8.3 - Symfony 7.4 LTS"

          # Symfony 8 on supported PHP versions
          - php-version: "8.4"
            symfony-require: "8.1.*"
            job-name: "PHP 8.4 - Symfony 8.1"

          - php-version: "8.5"
            symfony-require: "8.1.*"
            job-name: "PHP 8.5 - Symfony 8.1"

          # Forward-compat lane for upcoming Symfony 8.x releases
          - php-version: "8.5"
            symfony-require: "8.*"
            job-name: "PHP 8.5 - Symfony 8.x"

          - php-version: "8.6"
            symfony-require: "8.*"
            job-name: "PHP 8.6 - Symfony 8.x"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: "Install PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          ini-file: "development"
          tools: flex

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer cache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: "Install dependencies with Composer"
        run: composer update --no-interaction --no-progress --ansi --prefer-dist

      - name: Run test suite
        run: ./vendor/bin/phpunit
